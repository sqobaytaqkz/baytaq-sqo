<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>«Байтақ» - СКО филиалы</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00875A">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        baytaq: {
                            DEFAULT: '#00875A',
                            dark: '#006B47',
                            light: '#E6F3EE',
                            gold: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24 font-sans antialiased">

    <!-- Шапка сайта -->
    <header class="bg-white border-b border-gray-100 p-3 shadow-sm sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <img src="logo.png" alt="Байтақ" class="h-9 w-auto object-contain" onerror="this.src='https://via.placeholder.com/120x40/00875A/FFFFFF?text=BAYTAQ'">
            <span class="text-[10px] font-bold bg-baytaq-light text-baytaq px-2 py-0.5 rounded-full uppercase tracking-wider">
                СКО
            </span>
        </div>
        <button onclick="toggleModal(true)" class="bg-baytaq hover:bg-baytaq-dark text-white font-bold px-4 py-1.5 rounded-full text-xs shadow-sm transition">
            + Вступить
        </button>
    </header>

    <!-- Главный контент -->
    <main class="p-4 max-w-lg mx-auto space-y-5">
        
        <!-- Приветственный баннер -->
        <div class="bg-baytaq-light border border-emerald-100 rounded-2xl p-5 text-center relative overflow-hidden">
            <h1 class="text-xl font-bold text-baytaq-dark mb-1">Солтүстік Қазақстан филиалы</h1>
            <p class="text-xs text-gray-600 mb-4">«Байтақ» жасылдар партиясы / Партия зеленых «Байтақ»</p>
            <button onclick="toggleModal(true)" class="w-full bg-baytaq hover:bg-baytaq-dark text-white py-3 rounded-xl font-bold text-sm shadow transition">
                Подать заявку в партию
            </button>
        </div>

        <!-- Быстрый доступ -->
        <div class="grid grid-cols-2 gap-3">
            <div onclick="alert('Раздел приемной')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer active:scale-95 transition">
                <span class="text-2xl block mb-1">📝</span>
                <span class="font-bold text-sm text-gray-800 block">Приемная</span>
                <span class="text-[11px] text-gray-500">Подать обращение</span>
            </div>
            <div onclick="alert('Раздел взносов')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 cursor-pointer active:scale-95 transition">
                <span class="text-2xl block mb-1">💚</span>
                <span class="font-bold text-sm text-gray-800 block">Взнос / QR</span>
                <span class="text-[11px] text-gray-500">Поддержать филиал</span>
            </div>
        </div>

        <!-- Блок руководства / Команда -->
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
            <h2 class="font-bold text-sm text-gray-900 border-b pb-2">Руководство филиала</h2>
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-xl font-bold text-gray-500">
                    👤
                </div>
                <div>
                    <h3 class="font-bold text-sm text-gray-800">Председатель филиала</h3>
                    <p class="text-xs text-gray-500">СКО, г. Петропавловск</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Модальное окно «Вступить» -->
    <div id="joinModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-baytaq-dark">Заявка на вступление</h3>
                <button onclick="toggleModal(false)" class="text-gray-400 text-2xl font-bold">&times;</button>
            </div>
            <form id="joinForm" onsubmit="submitForm(event)" class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600">ФИО полностью</label>
                    <input type="text" required class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-baytaq outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Телефон</label>
                    <input type="tel" placeholder="+7 (700) 000-00-00" required class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-baytaq outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Район / Город СКО</label>
                    <input type="text" placeholder="Петропавловск, Кызылжарский и др." required class="w-full border rounded-lg p-2.5 text-sm mt-1 focus:ring-2 focus:ring-baytaq outline-none">
                </div>
                <button type="submit" class="w-full bg-baytaq hover:bg-baytaq-dark text-white py-3 rounded-xl font-bold text-sm shadow transition mt-2">
                    Отправить анкету
                </button>
            </form>
        </div>
    </div>

    <!-- Нижняя навигация PWA -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 text-[11px] text-gray-500 z-30">
        <a href="#" class="flex flex-col items-center text-baytaq font-bold">
            <span class="text-lg">🏠</span>Басты
        </a>
        <a href="#" class="flex flex-col items-center hover:text-baytaq">
            <span class="text-lg">👥</span>Команда
        </a>
        <a href="#" class="flex flex-col items-center hover:text-baytaq">
            <span class="text-lg">📩</span>Приемная
        </a>
        <a href="#" class="flex flex-col items-center hover:text-baytaq">
            <span class="text-lg">💚</span>Взнос
        </a>
    </nav>

    <script>
        function toggleModal(show) {
            document.getElementById('joinModal').classList.toggle('hidden', !show);
        }
        function submitForm(e) {
            e.preventDefault();
            alert('Заявка отправлена!');
            toggleModal(false);
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
